name: quality-gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Content quality gate (offline)
        run: npm run content:quality-gate
      - name: Code quality gate (tests + syntax)
        run: npm run code:quality-gate
